const D = () => DIFF[S.diff];

function count(type) { let n = 0; for (const b of S.blds) if (b.type === type) n++; return n; }
function maxOf(type) { return type === 'bank' && has('compound') ? 5 : BLD[type].max; }
function costOf(type) {
  if (type === 'pylon') return { min: Math.round((BLD.pylon.min + 15 * count('pylon')) * (isCmd('mohandar') ? .7 : 1)), gas: 0 };
  return { min: BLD[type].min, gas: BLD[type].gas || 0 };
}
function unitCost(k) { const u = UNITS[k]; let m = has('warfactory') && k !== 'worker' ? .75 : 1; if (k === 'worker' && isCmd('mohandar')) m *= .7; if (k === 'dark' && isCmd('vorazun')) m *= .5; return { min: Math.round(u.min * m), gas: Math.round(u.gas * m) }; }
function tierCost(b) { const t = (b.tier || 1) + 1, c = TIER_COST[t], d = BLD[b.type]; if (!c) return null;
  const m = has('blueprint') ? .6 : 1;
  return { min: Math.round(d.min * c.mul * m), gas: Math.round((c.gas + (d.gas || 0) * (t - 1)) * m), need: c.need }; }
function upCost(k) { const u = UPS[k], L = S.up[k];
  if (k === 'income') return { min: [300, 700, 1400, 2500, 4000][L] || 0, gas: [0, 0, 100, 250, 500][L] || 0 };
  return { min: Math.round(u.base * Math.pow(1 + L, 1.4)), gas: Math.round(u.gasBase * Math.pow(1 + L, 1.4)) }; }
const afford = c => S.min >= c.min && S.gas >= (c.gas || 0);
function pay(c) { if (!afford(c)) { log(S.min < c.min ? '광물이 부족합니다' : '가스가 부족합니다', '#ff9b9b'); return false; } S.min -= c.min; S.gas -= c.gas || 0; return true; }
function incomeAmount() { return Math.round((40 + S.workers * 12 + count('pylon') * 20 + count('outpost') * 100) * (1 + .6 * S.up.income) * D().income * (1 + .05 * P('income')) * (has('golden') ? 1.25 : 1) * (mut('poverty') ? .75 : 1) * (isCmd('mohandar') ? 1.2 : 1)); }

    return;
  }
  const rec = records(), d = loadSave();
  const recLine = Object.entries(DIFF).map(([k, v]) => { const r = rec[`${menu.map}|${k}`]; return `${v.name} ${r ? `${r.best}웨이브${r.wins ? ` · 승리 ${r.wins}` : ''}${r.endless ? ` · 무한 ${r.endless}` : ''}` : '-'}`; }).join(' / ');
  box.innerHTML = (menu.top || `<h1>🧱 극한 벽짓고 살아남기</h1>
    <div>스타크래프트2 유즈맵 '극한 벽짓고 살아남기' 스타일 싱글 플레이.</div>
    <ul>
      <li>좀비가 쉬지 않고 몰려온다. 입구를 벽으로 막고 수급(일꾼·수정탑)을 늘리며 100웨이브를 버티자.</li>
      <li>건물 19종(개별 강화·확장 기지), 유닛 17종 + 영웅 5명(레벨업·자동 스킬), 조합(J) ★, 테크 10, 업그레이드 13, 능력 6.</li>
      <li>5웨이브와 보스를 잡을 때마다 <b>유물</b> 26종 중 하나를 고른다. 판이 끝나면 <b>사이오닉 정수</b>로 영구 강화.</li>
      <li>적 19종 + 정예, 중간 보스 5, 보스 10(고유 패턴), 이벤트 10, 보너스 목표 3종, 보급 상자. 사령관 5명 중 하나를 고르고(H 능력), 변이원을 켜면 정수 보너스.</li>
      <li>조작: 우클릭 프로브 이동 · 드래그로 유닛 선택 후 우클릭 이동 · 건물 클릭 후 U 강화 · Q W E A S D 능력 · Tab 탭 · F 2배속 · P 일시정지</li>
    </ul>`) +
    `<div class="sect"><b>맵</b> ` + Object.entries(MAPS).map(([k, m]) => `<button class="opt ${menu.map === k ? 'on' : ''}" data-act="map" data-k="${k}">${m.name}</button>`).join('') + `<div class="rec">${MAPS[menu.map].desc}</div></div>` +
    `<div class="sect"><b>난이도</b> ` + Object.entries(DIFF).map(([k, v]) => `<button class="opt ${menu.diff === k ? 'on' : ''}" data-act="diff" data-k="${k}">${v.name}</button>`).join('') +
    `<button class="opt ${menu.endless ? 'on' : ''}" data-act="endless">무한 모드 ${menu.endless ? 'ON' : 'OFF'}</button></div>` +
    `<div class="sect"><b>사령관</b> ` + Object.entries(COMMANDERS).map(([k, c]) => `<button class="opt ${menu.cmd === k ? 'on' : ''}" data-act="cmd" data-k="${k}">${c.name}</button>`).join('') +
      `<div class="rec">패시브: ${COMMANDERS[menu.cmd].passive}<br>능력(H) ${COMMANDERS[menu.cmd].abil}: ${COMMANDERS[menu.cmd].abilTip}</div></div>` +
    `<div class="sect"><b>변이원</b> <span class="rec">켤수록 정수 보너스 +${Math.round(mutBonus(menu.muts) * 100)}%</span><br>` +
      Object.entries(MUTATORS).map(([k, m]) => `<button class="opt ${menu.muts.includes(k) ? 'on' : ''}" data-act="mut" data-k="${k}" title="${m.desc} (+${Math.round(m.bonus * 100)}%)">${m.name}</button>`).join('') +
      (menu.muts.length ? `<div class="rec">${menu.muts.map(k => `${MUTATORS[k].name}: ${MUTATORS[k].desc}`).join(' · ')}</div>` : '') + `</div>` +
    `<button class="big" data-act="start">시작</button>` + (d ? `<button class="alt" data-act="cont">이어하기 (${MAPS[d.map] ? MAPS[d.map].name : ''} ${DIFF[d.diff].name} 웨이브 ${d.wave})</button>` : '') +
    `<div class="rec">최고 기록 (${MAPS[menu.map].name}): ${recLine}</div>` +
    `<div class="sect">💠 사이오닉 정수 <b style="color:#c9a0ff">${meta.essence}</b> <button class="opt" data-act="perks">영구 강화</button><button class="opt" data-act="ach">업적 ${ACH.filter(a => meta.ach[a.id]).length}/${ACH.length}</button></div>`;
}
document.getElementById('startBox').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, k = b.dataset.k;
  if (a === 'map') menu.map = k;
  else if (a === 'diff') menu.diff = k;
  else if (a === 'endless') menu.endless = !menu.endless;
  else if (a === 'cmd') menu.cmd = k;
  else if (a === 'mut') { const i = menu.muts.indexOf(k); if (i >= 0) menu.muts.splice(i, 1); else menu.muts.push(k); }
  else if (a === 'start') { start(false, menu.diff, menu.map, menu.endless, menu.cmd, menu.muts.slice()); return; }
  else if (a === 'cont') { start(true); return; }
  else if (a === 'perks' || a === 'ach') menu.view = a;
  else if (a === 'back') menu.view = 'main';
  else if (a === 'perk') { const m = loadMeta(), lv = m.perks[k] || 0, cost = PERKS[k].cost * (lv + 1); if (lv < PERKS[k].max && m.essence >= cost) { m.essence -= cost; m.perks[k] = lv + 1; saveMeta(m); } }
  else if (a === 'goEndless') { document.getElementById('overlay').style.display = 'none'; S.over = false; S.endless = true; S.won = false; S.waveT = 5; banner('무한 모드', '100웨이브 이후에도 적이 계속 강해집니다'); return; }
  renderMenu();
});

// ═════════ 승패·시작 ═════════
function gameOver(win) {
  if (S.over) return;
  S.over = true; checkAch(); clearSave(); saveRecord(win);
  const meta = loadMeta();
  const gain = Math.floor((Math.floor(S.wave * D().essence) + 5 * (S.killsBy.boss || 0) + 3 * S.objCleared + (win ? 100 : 0)) * (1 + mutBonus(S.mutators)));
  meta.essence += gain; meta.stats.kills += S.kills; meta.stats.runs++; saveMeta(meta);
  const top = Object.entries(S.killsBy).filter(([k]) => ENEMY[k]).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([k, n]) => `${ENEMY[k].name} ${n}`).join(' · ');
  const ach = S.achNew.map(id => ACH.find(a => a.id === id).name).join(', ');
  menu.view = 'main';
  menu.top = (win
    ? `<h1>🏆 생존 성공! (${MAP.name} · ${D().name})</h1><div>칼날 여왕 케리건을 쓰러뜨렸습니다.</div>`
    : `<h1>💀 넥서스 파괴 (${MAP.name} · ${D().name}${S.endless ? ' · 무한' : ''})</h1><div>웨이브 ${S.wave}에서 기지가 무너졌습니다.</div>`)
    + `<div class="rec">플레이 ${Math.floor(S.time / 60)}분 · 처치 ${S.kills.toLocaleString()} · 보스 ${S.killsBy.boss || 0} · 중간 보스 ${S.killsBy.mini || 0} · 유물 ${S.relics.length}<br>${top}</div>`
    + `<div class="rec">피해 기여 상위: ${Object.entries(S.dmgBy).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([k, v]) => srcName(k) + ' ' + fmtN(v)).join(' · ')}</div>`
    + `<div style="margin:6px 0">💠 사이오닉 정수 <b style="color:#c9a0ff">+${gain}</b>${ach ? ` · 🏆 이번 판 업적: ${ach}` : ''}</div>`
    + (win && !S.endless ? `<button class="alt" data-act="goEndless">무한 모드로 계속하기</button>` : '') + '<hr style="border-color:#2a3340">';
  document.getElementById('overlay').style.display = 'flex';
  renderMenu();
  menu.top = '';
}

// ═════════ 루프 ═════════
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  if (cv.width !== Math.max(1, innerWidth) || cv.height !== Math.max(1, innerHeight)) resize();
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (S) {
    const pan = 900 * dt;
    if (keys.ArrowLeft) { cam.lock = false; cam.x -= pan; } if (keys.ArrowRight) { cam.lock = false; cam.x += pan; }
    if (keys.ArrowUp) { cam.lock = false; cam.y -= pan; } if (keys.ArrowDown) { cam.lock = false; cam.y += pan; }
    if (!S.over && !S.paused) for (let k = 0; k < S.speed && !S.over; k++) update(dt);
    draw(); updateHUD();
    infoT -= dt; if (infoT <= 0) { infoT = .25; renderInfo(); if (S.tab === 'stats') buildUI(); }
  }
}
function start(resume, diff, mapId, endless, cmd, muts) {
  document.getElementById('overlay').style.display = 'none';
  const d = resume ? loadSave() : null;
  if (!resume) clearSave();
  if (d) applySave(d); else newGame(diff || 'normal', mapId || 'canyon', !!endless, cmd || null, muts || []);
}
renderMenu();
resize();
requestAnimationFrame(loop);
</script>
</body>
